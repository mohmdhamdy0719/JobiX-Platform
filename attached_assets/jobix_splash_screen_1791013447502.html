<script>
  (function initSplashScreen() {
    const progressBar = document.getElementById('splash-progress');
    const statusText = document.getElementById('splash-status-text');
    
    if (!progressBar || !statusText) return;

    const stages = [
      { progress: '35%', label: 'Syncing ATS matching rules...' },
      { progress: '68%', label: 'Loading career frameworks...' },
      { progress: '92%', label: 'Preparing executive workspace...' },
      { progress: '100%', label: 'Ready to advance.' }
    ];

    let currentStage = 0;
    const interval = setInterval(() => {
      if (currentStage < stages.length) {
        const item = stages[currentStage];
        progressBar.style.width = item.progress;
        statusText.innerHTML = `
          <span class="material-symbols-outlined text-xs ${currentStage === stages.length - 1 ? 'text-semantic-success' : 'animate-spin'}">
            ${currentStage === stages.length - 1 ? 'check_circle' : 'sync'}
          </span>
          <span>${item.label}</span>
        `;
        currentStage++;
      } else {
        clearInterval(interval);
      }
    }, 750);
  })();
