</button>

</div>

<script>
  (function() {
    const radioLabels = document.querySelectorAll('[role="radiogroup"] label');
    radioLabels.forEach(label => {
      label.addEventListener('click', () => {
        radioLabels.forEach(l => {
          l.classList.remove('bg-surface-container-low');
          l.classList.add('bg-surface-card');
          const title = l.querySelector('.font-label-lg');
          if (title) {
            title.classList.remove('text-brand-navy', 'font-bold');
            title.classList.add('text-text-primary');
          }
          const iconBox = l.querySelector('.w-10');
          if (iconBox) {
            iconBox.className = 'w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center shrink-0 text-text-secondary group-hover:text-brand-royal-blue transition-colors';
          }
          const checkNode = l.querySelector('.w-6, .w-5');
          if (checkNode) {
            checkNode.className = 'w-5 h-5 rounded-full bg-surface-container flex items-center justify-center shrink-0';
            checkNode.innerHTML = '<div class="w-2 h-2 rounded-full bg-transparent"></div>';
          }
        });

        label.classList.remove('bg-surface-card');
        label.classList.add('bg-surface-container-low');
        const activeTitle = label.querySelector('.font-label-lg');
        if (activeTitle) {
          activeTitle.classList.remove('text-text-primary');
          activeTitle.classList.add('text-brand-navy', 'font-bold');
        }
        const activeIconBox = label.querySelector('.w-10');
        if (activeIconBox) {
          activeIconBox.className = 'w-10 h-10 rounded-lg bg-surface-container-highest flex items-center justify-center shrink-0 text-brand-royal-blue';
        }
        const activeCheck = label.querySelector('.w-5, .w-6');
        if (activeCheck) {
          activeCheck.className = 'w-6 h-6 rounded-full bg-brand-royal-blue flex items-center justify-center shrink-0 text-on-primary';
          activeCheck.innerHTML = '<span class="material-symbols-outlined text-[16px]">check</span>';
        }
      });
    });
  })();
</script></main>
