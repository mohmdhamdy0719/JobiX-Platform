<!-- Interactive Question Options (Single Selection) -->

<!-- Option 1: In my current city -->

<div class="flex items-center gap-space-sm min-w-0 pr-space-sm">

<span class="material-symbols-outlined text-[22px]">location_city</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-headline-sm text-headline-sm text-text-primary truncate">In my current city</span>
<span class="font-body-sm text-body-sm text-text-secondary truncate">Focus on immediate local market</span>
</div>
</div>
<input class="sr-only" name="target_location" type="radio" value="current_city">
<div class="radio-indicator w-5 h-5 rounded-full bg-surface-canvas flex items-center justify-center flex-shrink-0">
<div class="dot w-2.5 h-2.5 rounded-full bg-transparent"></div>

<!-- Option 2: Somewhere else in my country -->
<label class="group relative flex items-center justify-between p-space-md rounded-xl bg-surface-secondary cursor-pointer transition-all duration-150 active:scale-[0.99] shadow-sm">
<div class="flex items-center gap-space-sm min-w-0 pr-space-sm">
<div class="w-10 h-10 rounded-lg bg-surface-canvas flex items-center justify-center text-text-secondary group-hover:text-primary transition-colors flex-shrink-0">
<span class="material-symbols-outlined text-[22px]">map</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-headline-sm text-headline-sm text-text-primary truncate">Somewhere else in my country</span>
<span class="font-body-sm text-body-sm text-text-secondary truncate">Domestic relocation or regional hubs</span>
</div>
</div>
<input class="sr-only" name="target_location" type="radio" value="domestic">
<div class="radio-indicator w-5 h-5 rounded-full bg-surface-canvas flex items-center justify-center flex-shrink-0">
<div class="dot w-2.5 h-2.5 rounded-full bg-transparent"></div>
</div>
</label>
<!-- Option 3: Remotely (Selected State by Default) -->
<label class="group relative flex items-center justify-between p-space-md rounded-xl bg-surface-container-low shadow-sm cursor-pointer transition-all duration-150 active:scale-[0.99]" data-selected="true">
<div class="flex items-center gap-space-sm min-w-0 pr-space-sm">
<div class="w-10 h-10 rounded-lg bg-primary-container text-on-primary flex items-center justify-center flex-shrink-0 shadow-sm">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: &quot;FILL&quot; 1;">laptop_mac</span>
</div>
<div class="flex flex-col min-w-0">
<div class="flex items-center gap-space-xs">
<span class="font-headline-sm text-headline-sm text-brand-navy truncate">Remotely</span>
<span class="px-space-xs py-0.5 rounded-full bg-primary/10 text-primary font-label-sm text-[11px] leading-tight font-medium">Bilingual &amp; Global</span>
</div>
<span class="font-body-sm text-body-sm text-text-secondary truncate">Remote-first and distributed teams</span>
</div>
</div>
<input checked="" class="sr-only" name="target_location" type="radio" value="remote">
<div class="w-6 h-6 rounded-full bg-primary-container text-on-primary flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
</label>
<!-- Option 4: Abroad -->
<label class="group relative flex items-center justify-between p-space-md rounded-xl bg-surface-secondary cursor-pointer transition-all duration-150 active:scale-[0.99] shadow-sm">
<div class="flex items-center gap-space-sm min-w-0 pr-space-sm">
<div class="w-10 h-10 rounded-lg bg-surface-canvas flex items-center justify-center text-text-secondary group-hover:text-primary transition-colors flex-shrink-0">
<span class="material-symbols-outlined text-[22px]">flight_takeoff</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-headline-sm text-headline-sm text-text-primary truncate">Abroad</span>
<span class="font-body-sm text-body-sm text-text-secondary truncate">International visa sponsorship ready</span>
</div>
</div>
<input class="sr-only" name="target_location" type="radio" value="abroad">
<div class="radio-indicator w-5 h-5 rounded-full bg-surface-canvas flex items-center justify-center flex-shrink-0">
<div class="dot w-2.5 h-2.5 rounded-full bg-transparent"></div>
</div>
</label>
<!-- Option 5: Multiple locations -->
<label class="group relative flex items-center justify-between p-space-md rounded-xl bg-surface-secondary cursor-pointer transition-all duration-150 active:scale-[0.99] shadow-sm">
<div class="flex items-center gap-space-sm min-w-0 pr-space-sm">
<div class="w-10 h-10 rounded-lg bg-surface-canvas flex items-center justify-center text-text-secondary group-hover:text-primary transition-colors flex-shrink-0">
<span class="material-symbols-outlined text-[22px]">hub</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-headline-sm text-headline-sm text-text-primary truncate">Multiple locations</span>
<span class="font-body-sm text-body-sm text-text-secondary truncate">Open to several selected regions</span>
</div>
</div>
<input class="sr-only" name="target_location" type="radio" value="multiple">
<div class="radio-indicator w-5 h-5 rounded-full bg-surface-canvas flex items-center justify-center flex-shrink-0">
<div class="dot w-2.5 h-2.5 rounded-full bg-transparent"></div>
</div>
</label>
<!-- Option 6: I'm not sure yet -->
<label class="group relative flex items-center justify-between p-space-md rounded-xl bg-surface-secondary cursor-pointer transition-all duration-150 active:scale-[0.99] shadow-sm">

<div class="w-10 h-10 rounded-lg bg-surface-canvas flex items-center justify-center text-text-secondary group-hover:text-primary transition-colors flex-shrink-0">
<span class="material-symbols-outlined text-[22px]">explore</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-headline-sm text-headline-sm text-text-primary truncate">I'm not sure yet</span>
<span class="font-body-sm text-body-sm text-text-secondary truncate">Broaden opportunities and recommendations</span>
</div>
</div>
<input class="sr-only" name="target_location" type="radio" value="undecided">
<div class="radio-indicator w-5 h-5 rounded-full bg-surface-canvas flex items-center justify-center flex-shrink-0">
<div class="dot w-2.5 h-2.5 rounded-full bg-transparent"></div>
</div>
</label>
</form>
<!-- Regional ATS Standards Trust Cue -->
<div class="px-gutter pt-space-xs pb-space-md">
<div class="flex items-start gap-space-xs p-space-sm rounded-xl bg-surface-secondary text-text-secondary">
<span class="material-symbols-outlined text-[18px] text-primary flex-shrink-0 mt-0.5">verified_user</span>
<p class="font-body-sm text-body-sm leading-snug">
        JobiX supports international, GCC, and local job market formats.
      </p>
</div>
</div>
<!-- Persistent Bottom Action Area -->
<div class="sticky bottom-0 w-full bg-surface-canvas/95 backdrop-blur-md px-gutter py-space-md shadow-[0_-4px_12px_rgba(15,23,42,0.03)] flex flex-col gap-space-xs z-30">
<button class="w-full h-12 rounded-xl bg-primary-container hover:bg-brand-blue-hover active:bg-brand-deep-blue text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-space-xs transition-colors shadow-sm" id="continue-step-btn" type="button">
<span class="">Continue</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
<script>
  (function() {
    const labels = document.querySelectorAll('#location-options-form label');
    
    labels.forEach(label => {
      label.addEventListener('click', function() {
        labels.forEach(l => {
          l.removeAttribute('data-selected');
          l.className = 'group relative flex items-center justify-between p-space-md rounded-xl bg-surface-secondary cursor-pointer transition-all duration-150 active:scale-[0.99] shadow-sm';
          
          const iconContainer = l.querySelector('.flex-shrink-0:first-child');
          if (iconContainer) {
            iconContainer.className = 'w-10 h-10 rounded-lg bg-surface-canvas flex items-center justify-center text-text-secondary group-hover:text-primary transition-colors flex-shrink-0';
          }
          
          const textTitle = l.querySelector('.font-headline-sm');
          if (textTitle) {
            textTitle.className = 'font-headline-sm text-headline-sm text-text-primary truncate';
          }

          const rightIndicator = l.querySelector('.radio-indicator, .bg-primary-container');
          if (rightIndicator) {
            rightIndicator.className = 'radio-indicator w-5 h-5 rounded-full bg-surface-canvas flex items-center justify-center flex-shrink-0';
            rightIndicator.innerHTML = '<div class="dot w-2.5 h-2.5 rounded-full bg-transparent"></div>';
          }
        });

        this.setAttribute('data-selected', 'true');
        this.className = 'group relative flex items-center justify-between p-space-md rounded-xl bg-surface-container-low shadow-sm cursor-pointer transition-all duration-150 active:scale-[0.99]';
        
        const activeIcon = this.querySelector('.flex-shrink-0:first-child');
        if (activeIcon) {
          activeIcon.className = 'w-10 h-10 rounded-lg bg-primary-container text-on-primary flex items-center justify-center flex-shrink-0 shadow-sm';
        }

        const activeTitle = this.querySelector('.font-headline-sm');
        if (activeTitle) {
          activeTitle.className = 'font-headline-sm text-headline-sm text-brand-navy truncate';
        }

        const rightArea = this.querySelector('.radio-indicator, .bg-primary-container');
        if (rightArea) {
          rightArea.className = 'w-6 h-6 rounded-full bg-primary-container text-on-primary flex items-center justify-center flex-shrink-0';
          rightArea.innerHTML = '<span class="material-symbols-outlined text-[16px]">check</span>';
        }

        const radio = this.querySelector('input[type="radio"]');
        if (radio) radio.checked = true;
      });
    });

    const continueBtn = document.getElementById('continue-step-btn');
    if (continueBtn) {
      continueBtn.addEventListener('click', () => {
        const selected = document.querySelector('input[name="target_location"]:checked');
        console.log('Selected Target Location:', selected ? selected.value : 'none');
      });
    }
  })();
</script></main>
